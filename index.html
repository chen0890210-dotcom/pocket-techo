<body>
<style>
  :root{
    --bg:#F3EFE6;
    --surface:#FFFFFF;
    --surface-2:#EAE4D6;
    --text:#2A2621;
    --text-dim:#6B6255;
    --accent:#9C7A2E;
    --accent-soft:rgba(156,122,46,0.12);
    --accent-ink:#FFFFFF;
    --line:#DDD5C4;
    --good:#4F7A5C;
    --good-soft:rgba(79,122,92,0.12);
    --bad:#A85A3C;
    --bad-soft:rgba(168,90,60,0.12);
    --shadow:0 1px 2px rgba(42,38,33,0.08);
    --cat-1:#2a78d6;
    --cat-2:#eb6834;
    --cat-3:#1baf7a;
    --cat-4:#eda100;
    --cat-5:#e87ba4;
    --cat-6:#008300;
    --cat-7:#4a3aa7;
    --cat-8:#e34948;
    --frame-bg:#E6DFCC;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1A17;
      --surface:#262320;
      --surface-2:#302C27;
      --text:#EDE8DF;
      --text-dim:#A69C8D;
      --accent:#C9A24B;
      --accent-soft:rgba(201,162,75,0.16);
      --accent-ink:#1C1A17;
      --line:#3A352F;
      --good:#7FA88A;
      --good-soft:rgba(127,168,138,0.16);
      --bad:#C67B5C;
      --bad-soft:rgba(198,123,92,0.16);
      --shadow:0 1px 2px rgba(0,0,0,0.35);
      --cat-1:#3987e5;
      --cat-2:#d95926;
      --cat-3:#199e70;
      --cat-4:#c98500;
      --cat-5:#d55181;
      --cat-6:#008300;
      --cat-7:#9085e9;
      --cat-8:#e66767;
      --frame-bg:#0F0E0C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1A17;
    --surface:#262320;
    --surface-2:#302C27;
    --text:#EDE8DF;
    --text-dim:#A69C8D;
    --accent:#C9A24B;
    --accent-soft:rgba(201,162,75,0.16);
    --accent-ink:#1C1A17;
    --line:#3A352F;
    --good:#7FA88A;
    --good-soft:rgba(127,168,138,0.16);
    --bad:#C67B5C;
    --bad-soft:rgba(198,123,92,0.16);
    --shadow:0 1px 2px rgba(0,0,0,0.35);
    --cat-1:#3987e5;
    --cat-2:#d95926;
    --cat-3:#199e70;
    --cat-4:#c98500;
    --cat-5:#d55181;
    --cat-6:#008300;
    --cat-7:#9085e9;
    --cat-8:#e66767;
    --frame-bg:#0F0E0C;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans TC','IBM Plex Sans',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  @media (min-width:640px){
    body{
      background:var(--frame-bg);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:32px 16px;
    }
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}

  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  input{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--bg);
  }
  @media (min-width:640px){
    .app{
      width:420px;
      min-height:0;
      height:min(860px, calc(100vh - 64px));
      border-radius:28px;
      box-shadow:0 24px 70px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.08);
      overflow:hidden;
    }
  }

  .content{
    flex:1;
    overflow-y:auto;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 100px;
  }
  .tab-panel{display:flex;flex-direction:column;gap:16px;animation:fade .18s ease;}
  .tab-panel[hidden]{display:none;}
  @media (prefers-reduced-motion: reduce){ .tab-panel{animation:none;} }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---- summary card ---- */
  .summary{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    box-shadow:var(--shadow);
  }
  .summary-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:10px;}
  .summary-row{display:flex;gap:10px;}
  .stat{flex:1;display:flex;flex-direction:column;gap:4px;}
  .stat-k{font-size:11px;color:var(--text-dim);}
  .stat-v{font-size:17px;font-weight:600;}
  .stat-v.good{color:var(--good);}
  .stat-v.bad{color:var(--bad);}
  .stat-divider{width:1px;background:var(--line);margin:2px 0;}

  /* ---- section title ---- */
  .section-title{
    font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);
    padding:4px 2px;
  }

  /* ---- list group ---- */
  .list{display:flex;flex-direction:column;gap:10px;}

  .row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 12px;
  }
  .row-body{flex:1;min-width:0;}
  .row-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .row-del{
    flex:none;width:28px;height:28px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
  }
  .row-del svg{width:15px;height:15px;}

  /* ---- system link buttons (washi-tape note style) ---- */
  .sys-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding-top:8px;}
  .sys-btn{
    position:relative;background:#FFFDF5;border-radius:4px;
    padding:20px 10px 12px;min-height:86px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;
    box-shadow:0 3px 8px rgba(20,16,8,0.28);
    font-family:'Nunito','IBM Plex Sans TC',sans-serif;
  }
  .sys-btn:nth-child(odd){transform:rotate(-1.6deg);}
  .sys-btn:nth-child(even){transform:rotate(1.4deg);}
  .sys-tape{
    position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-2deg);
    width:46px;height:16px;background:rgba(255,209,102,0.8);border-radius:2px;
  }
  .sys-btn .sys-icon{font-size:15px;line-height:1;margin-bottom:2px;}
  .sys-btn .sys-name{
    font-size:13px;font-weight:700;color:#6B5A3A;font-family:'Baloo 2','IBM Plex Sans TC',sans-serif;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .sys-btn .sys-host{font-size:9.5px;font-weight:600;color:#B0A488;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .sys-del{
    position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#C4A868;
  }
  .sys-del svg{width:11px;height:11px;}

  /* ---- task row ---- */
  .task-row{padding:11px 12px;}
  .task-check{
    flex:none;width:22px;height:22px;border-radius:50%;
    border:1.6px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .task-check svg{width:13px;height:13px;opacity:0;transition:opacity .12s;}
  .task-check.done{background:var(--good);border-color:var(--good);}
  .task-check.done svg{opacity:1;color:#fff;}
  .task-text{font-size:14px;}
  .task-text.done{color:var(--text-dim);text-decoration:line-through;}
  .task-pill{
    font-size:11px;padding:2px 7px;border-radius:5px;flex:none;
    background:var(--surface-2);color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
  }
  .task-pill.today{background:var(--accent-soft);color:var(--accent);}
  .task-pill.over{background:var(--bad-soft);color:var(--bad);}
  .task-pill.urgent{background:var(--bad-soft);color:var(--bad);font-weight:600;}
  .icon-btn.urgent-active{background:var(--bad-soft);color:var(--bad);}

  /* ---- add task inline ---- */
  .add-inline{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:6px 6px 6px 14px;
  }
  .add-inline input{
    flex:1;border:none;background:none;font-size:16px;padding:8px 0;color:var(--text);
  }
  .add-inline input::placeholder{color:var(--text-dim);}
  .icon-btn{
    flex:none;width:40px;height:40px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);
  }
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.active{background:var(--accent-soft);color:var(--accent);}
  .add-inline .submit-btn{background:var(--accent);color:var(--accent-ink);}
  .due-picker{padding:0 6px 8px 14px;}
  .due-picker input{
    background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
    padding:6px 8px;font-size:16px;color:var(--text);font-family:'IBM Plex Mono',monospace;
  }

  /* ---- empty state ---- */
  .empty{
    padding:36px 20px;text-align:center;color:var(--text-dim);font-size:13px;
    border:1px dashed var(--line);border-radius:10px;
  }

  /* ---- fab ---- */
  .fab{
    position:absolute;right:16px;
    bottom:calc(78px + env(safe-area-inset-bottom,0px));
    width:52px;height:52px;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.22);
    z-index:20;
  }
  .fab svg{width:22px;height:22px;}
  .fab[hidden]{display:none;}

  /* ---- tab bar ---- */
  .tabbar{
    position:sticky;bottom:0;left:0;right:0;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
    z-index:10;
  }
  .tab-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 4px;color:var(--text-dim);border-radius:8px;position:relative;
  }
  .tab-btn svg{width:21px;height:21px;}
  .tab-btn span{font-size:10.5px;}
  .tab-btn.active{color:var(--accent);}
  .tab-btn.active::before{
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:16px;height:2px;border-radius:2px;background:var(--accent);
  }

  /* ---- modal ---- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,18,15,0.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:30;
  }
  .modal-backdrop[hidden]{display:none;}
  .modal[hidden]{display:none;}
  .modal{
    width:100%;max-width:480px;background:var(--surface);
    border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:14px;
    animation:slideup .2s ease;
    max-height:88vh;overflow-y:auto;
  }
  @media (prefers-reduced-motion: reduce){ .modal{animation:none;} }
  @keyframes slideup{ from{transform:translateY(16px); opacity:0.6;} to{transform:none; opacity:1;} }
  .modal-head{display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-size:15px;font-weight:600;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);}
  .field input{
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:11px 12px;font-size:16px;width:100%;
  }
  .modal-actions{display:flex;gap:10px;margin-top:4px;}
  .btn{flex:1;padding:12px;border-radius:9px;font-size:14px;font-weight:600;text-align:center;}
  .btn-ghost{background:var(--surface-2);color:var(--text-dim);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:disabled{opacity:0.45;}
</style>

<div class="app">
  <main class="content">

    <section class="tab-panel" id="panel-tasks" hidden>
      <div class="summary">
        <div class="summary-label">待辦</div>
        <div class="summary-row">
          <div class="stat"><span class="stat-k">未完成</span><span class="stat-v num" id="taskActiveCount">0</span></div>
          <div class="stat-divider"></div>
          <div class="stat"><span class="stat-k">已完成</span><span class="stat-v good num" id="taskDoneCount">0</span></div>
        </div>
      </div>

      <div>
        <div class="add-inline">
          <button class="icon-btn" id="taskUrgentToggle" title="標記為急件" aria-label="標記為急件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8.5 15H3.5L12 3z"/><path d="M12 10v4M12 17v.01"/></svg>
          </button>
          <button class="icon-btn" id="taskDueToggle" title="設定日期" aria-label="設定日期">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          </button>
          <input id="taskInput" type="text" placeholder="新增待辦事項…" maxlength="80">
          <button class="icon-btn submit-btn" id="taskSubmit" aria-label="新增">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="due-picker" id="taskDueWrap" hidden>
          <input type="date" id="taskDueInput">
        </div>
      </div>

      <div class="list" id="taskList"></div>
    </section>

    <section class="tab-panel" id="panel-system" hidden>
      <div class="section-title">系統連結</div>
      <div class="sys-grid" id="systemLinkList"></div>
    </section>

  </main>

  <button class="fab" id="fabAdd" aria-label="新增">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab-btn" data-tab="system">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M8 12l-2.5 2.5a3.5 3.5 0 004.9 4.9L13 17"/><path d="M16 12l2.5-2.5a3.5 3.5 0 00-4.9-4.9L11 7"/></svg>
      <span>系統</span>
    </button>
    <button class="tab-btn" data-tab="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/></svg>
      <span>待辦</span>
    </button>
  </nav>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modalSystemLink" hidden>
    <div class="modal-head">
      <div class="modal-title">新增系統連結</div>
      <button class="icon-btn" id="closeSystemLinkModal" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="field">
      <div class="field-label">名稱</div>
      <input type="text" id="sysLinkNameInput" placeholder="例如：輪休補休管制表" maxlength="30">
    </div>
    <div class="field">
      <div class="field-label">網址</div>
      <input type="url" id="sysLinkUrlInput" placeholder="https://...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelSystemLink" type="button">取消</button>
      <button class="btn btn-primary" id="saveSystemLink" type="button" disabled>儲存</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      if(!raw) return fallback;
      var v = JSON.parse(raw);
      return Array.isArray(v) ? v : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }
  function loadStr(key, fallback){
    try{ return localStorage.getItem(key) || fallback; }catch(e){ return fallback; }
  }
  function saveStr(key, val){
    try{ localStorage.setItem(key, val); }catch(e){}
  }
  var DEFAULT_SYSTEM_LINKS = [
    {id:'default-wendan', name:'Poraw的文旦', url:'https://bespoke-squirrel-2762f6.netlify.app/'},
    {id:'sys-signin', name:'成功防宣隊簽到系統', url:'https://inspiring-lollipop-d4675f.netlify.app/'},
    {id:'sys-scoring', name:'成功消防分隊 - 防火宣導競賽評分系統', url:'https://bejewelled-pithivier-50b276.netlify.app/'},
    {id:'sys-visit', name:'志工訪視系統', url:'https://volunteer-visit-app.onrender.com/index.html'},
    {id:'sys-alarm', name:'住警器訪查系統', url:'https://courageous-douhua-eb0002.netlify.app/'},
    {id:'sys-whiteboard', name:'電子白板', url:'https://chenggong-whiteboard.onrender.com/whiteboard'}
  ];

  var state = {
    tab: loadStr('pt_lasttab','tasks'),
    tasks: loadJSON('pt_tasks', []),
    systemLinks: loadJSON('pt_systemlinks', null) || DEFAULT_SYSTEM_LINKS.slice()
  };
  (function seedSystemLinks(){
    if(loadStr('pt_syslinks_seed_v2','') === '1') return;
    var changed = false;
    DEFAULT_SYSTEM_LINKS.forEach(function(seed){
      var existing = state.systemLinks.filter(function(l){ return l.url === seed.url; })[0];
      if(!existing){ state.systemLinks.push(seed); changed = true; }
      else if(existing.name !== seed.name){ existing.name = seed.name; changed = true; }
    });
    saveStr('pt_syslinks_seed_v2', '1');
    if(changed) saveJSON('pt_systemlinks', state.systemLinks);
  })();

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function parseDate(s){
    var p = s.split('-');
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function daysBetween(fromStr, toStr){
    var a = midnight(parseDate(fromStr));
    var b = midnight(parseDate(toStr));
    return Math.round((b - a) / 86400000);
  }
  // ---------- tabs ----------
  var panels = {
    tasks: document.getElementById('panel-tasks'),
    system: document.getElementById('panel-system')
  };
  var tabBtns = Array.prototype.slice.call(document.querySelectorAll('.tab-btn'));
  var fab = document.getElementById('fabAdd');

  function setTab(tab){
    state.tab = tab;
    saveStr('pt_lasttab', tab);
    Object.keys(panels).forEach(function(k){ panels[k].hidden = (k !== tab); });
    tabBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
    fab.hidden = (tab === 'tasks');
    renderAll();
  }
  tabBtns.forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); });
  });

  fab.addEventListener('click', function(){
    if(state.tab === 'system') openSystemLinkModal();
  });

  var modalBackdrop = document.getElementById('modalBackdrop');
  function closeModals(){ modalBackdrop.hidden = true; }
  modalBackdrop.addEventListener('click', function(e){ if(e.target === modalBackdrop) closeModals(); });

  function escapeHtml(s){
    var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  function wireDelete(container, onDelete){
    container.querySelectorAll('.row-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        onDelete(btn.getAttribute('data-id'));
      });
    });
  }

  // ================= TASKS =================
  var taskInput = document.getElementById('taskInput');
  var taskSubmit = document.getElementById('taskSubmit');
  var taskDueToggle = document.getElementById('taskDueToggle');
  var taskDueWrap = document.getElementById('taskDueWrap');
  var taskDueInput = document.getElementById('taskDueInput');
  var taskUrgentToggle = document.getElementById('taskUrgentToggle');

  taskDueToggle.addEventListener('click', function(){
    var show = taskDueWrap.hidden;
    taskDueWrap.hidden = !show;
    taskDueToggle.classList.toggle('active', show);
    if(show && !taskDueInput.value) taskDueInput.value = todayStr();
  });
  taskUrgentToggle.addEventListener('click', function(){
    taskUrgentToggle.classList.toggle('urgent-active');
  });

  function addTask(){
    var text = taskInput.value.trim();
    if(!text) return;
    state.tasks.push({
      id: uid(), text: text, done: false,
      priority: taskUrgentToggle.classList.contains('urgent-active') ? 'urgent' : 'normal',
      due: (!taskDueWrap.hidden && taskDueInput.value) ? taskDueInput.value : null
    });
    saveJSON('pt_tasks', state.tasks);
    taskInput.value = '';
    taskDueWrap.hidden = true;
    taskDueToggle.classList.remove('active');
    taskUrgentToggle.classList.remove('urgent-active');
    renderTasks();
    taskInput.focus();
  }
  taskSubmit.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.isComposing) addTask(); });

  function renderTasks(){
    var active = state.tasks.filter(function(t){ return !t.done; });
    var done = state.tasks.filter(function(t){ return t.done; });
    document.getElementById('taskActiveCount').textContent = active.length;
    document.getElementById('taskDoneCount').textContent = done.length;

    function urgentRank(t){ return t.priority === 'urgent' ? 1 : 0; }
    active.sort(function(a,b){
      if(a.due && b.due) return a.due < b.due ? -1 : (a.due > b.due ? 1 : urgentRank(b)-urgentRank(a));
      if(a.due) return -1;
      if(b.due) return 1;
      return urgentRank(b) - urgentRank(a);
    });

    var wrap = document.getElementById('taskList');
    wrap.innerHTML = '';
    if(state.tasks.length === 0){
      return;
    }
    var today = todayStr();
    active.concat(done).forEach(function(t){
      var row = document.createElement('div');
      row.className = 'row task-row';
      var duePill = '';
      if(t.due && !t.done){
        var daysLeft = daysBetween(today, t.due);
        var cls = daysLeft < 0 ? 'over' : (daysLeft === 0 ? 'today' : '');
        var label = daysLeft < 0 ? ('已逾期 '+Math.abs(daysLeft)+' 天') : (daysLeft === 0 ? '今天到期' : '剩 '+daysLeft+' 天');
        duePill = '<span class="task-pill '+cls+'">'+label+'</span>';
      }
      var urgentPill = (t.priority === 'urgent' && !t.done) ? '<span class="task-pill urgent">急</span>' : '';
      row.innerHTML =
        '<button class="task-check '+(t.done?'done':'')+'" data-id="'+t.id+'" aria-label="切換完成">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4.5 4.5L19 7"/></svg>'+
        '</button>'+
        '<span class="row-body"><span class="task-text '+(t.done?'done':'')+'">'+escapeHtml(t.text)+'</span></span>'+
        urgentPill+
        duePill+
        '<button class="row-del" data-id="'+t.id+'" aria-label="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg></button>';
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('.task-check').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var t = state.tasks.filter(function(x){ return x.id===id; })[0];
        if(t){ t.done = !t.done; saveJSON('pt_tasks', state.tasks); renderTasks(); }
      });
    });
    wireDelete(wrap, function(id){
      state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
      saveJSON('pt_tasks', state.tasks);
      renderTasks();
    });
  }

  // ================= SYSTEM LINKS =================
  var modalSystemLink = document.getElementById('modalSystemLink');
  var sysLinkNameInput = document.getElementById('sysLinkNameInput');
  var sysLinkUrlInput = document.getElementById('sysLinkUrlInput');
  var saveSystemLinkBtn = document.getElementById('saveSystemLink');

  function validateSystemLink(){
    var url = sysLinkUrlInput.value.trim();
    saveSystemLinkBtn.disabled = !(sysLinkNameInput.value.trim() && /^https?:\/\//i.test(url));
  }
  sysLinkNameInput.addEventListener('input', validateSystemLink);
  sysLinkUrlInput.addEventListener('input', validateSystemLink);

  function openSystemLinkModal(){
    sysLinkNameInput.value = '';
    sysLinkUrlInput.value = '';
    validateSystemLink();
    modalSystemLink.hidden = false;
    modalBackdrop.hidden = false;
  }
  document.getElementById('closeSystemLinkModal').addEventListener('click', closeModals);
  document.getElementById('cancelSystemLink').addEventListener('click', closeModals);
  saveSystemLinkBtn.addEventListener('click', function(){
    var name = sysLinkNameInput.value.trim();
    var url = sysLinkUrlInput.value.trim();
    if(!name || !/^https?:\/\//i.test(url)) return;
    state.systemLinks.push({id: uid(), name: name, url: url});
    saveJSON('pt_systemlinks', state.systemLinks);
    closeModals();
    renderSystemLinks();
  });

  function renderSystemLinks(){
    var wrap = document.getElementById('systemLinkList');
    wrap.innerHTML = '';
    if(state.systemLinks.length === 0){
      wrap.innerHTML = '<div class="empty">還沒有系統連結，點右下角「＋」新增</div>';
      return;
    }
    state.systemLinks.forEach(function(link){
      var btn = document.createElement('div');
      btn.setAttribute('role', 'button');
      btn.setAttribute('tabindex', '0');
      btn.className = 'sys-btn';
      var hostname = '';
      try{ hostname = new URL(link.url).hostname; }catch(e){ hostname = link.url; }
      btn.innerHTML =
        '<span class="sys-tape"></span>'+
        '<span class="sys-icon">📌</span>'+
        '<span class="sys-name">'+escapeHtml(link.name)+'</span>'+
        '<span class="sys-host">'+escapeHtml(hostname)+'</span>'+
        '<button class="row-del sys-del" data-id="'+link.id+'" aria-label="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      btn.addEventListener('click', function(e){
        if(e.target.closest('.row-del')) return;
        window.open(link.url, '_blank', 'noopener');
      });
      btn.addEventListener('keydown', function(e){
        if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.row-del')){
          e.preventDefault();
          window.open(link.url, '_blank', 'noopener');
        }
      });
      wrap.appendChild(btn);
    });
    wireDelete(wrap, function(id){
      state.systemLinks = state.systemLinks.filter(function(l){ return l.id !== id; });
      saveJSON('pt_systemlinks', state.systemLinks);
      renderSystemLinks();
    });
  }

  function renderAll(){
    renderTasks();
    renderSystemLinks();
  }

  setTab(panels.hasOwnProperty(state.tab) ? state.tab : 'tasks');
})();
</script>

</body>
</html>
